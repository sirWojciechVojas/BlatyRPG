server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    # Certyfikaty
    ssl_certificate /etc/nginx/certs/localhost+1.pem;
    ssl_certificate_key /etc/nginx/certs/localhost+1-key.pem;

    # Logi
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Punkt wejścia dla PHP
    index index.php index.html;

    # ⛔ TRYB API-FIRST (Zablokowany Frontend)
    # Zamiast kierować do Vue, zwracamy komunikat tekstowy.
    location / {
        default_type text/plain;
        return 200 "BlatyRPG Backend Mode. Frontend is disabled. Use Postman on /api endpoints.";

        # ⬇️ PONIŻSZA KONFIGURACJA FRONTENDU JEST TYMCZASOWO WYŁĄCZONA ⬇️
        # proxy_pass http://frontend:8080;
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
        # proxy_set_header Host $host;
    }

    # ⛔ Wyłączona obsługa HMR (bo nie ma kontenera frontend)
    # location /sockjs-node {
    #    proxy_pass http://frontend:8080;
    #    proxy_http_version 1.1;
    #    proxy_set_header Upgrade $http_upgrade;
    #    proxy_set_header Connection "upgrade";
    # }

    # --- 2. BACKEND (CodeIgniter 4) - TO DZIAŁA ---
    location /api {
        alias /var/www/html/public;

        # 🔧 ZMIANA: Zamiast wskazywać plik bezpośrednio, używamy nazwanej lokacji @codeigniter.
        # To zapobiega sytuacji, w której Nginx nie znajduje pliku i wypada do głównego bloku '/'
        try_files $uri $uri/ @codeigniter;

        # Obsługa PHP wewnątrz lokacji /api
        location ~ \.php$ {
            include fastcgi_params;
            # WAŻNE: Przy 'alias' musimy użyć $request_filename
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_pass php:9000;
        }
    }

    # ⛔ Wyłączone Websockety (bo nie ma kontenera websocket)
    # location /socket.io {
    #    proxy_pass http://websocket:3000;
    #    proxy_http_version 1.1;
    #    proxy_set_header Upgrade $http_upgrade;
    #    proxy_set_header Connection "upgrade";
    #    proxy_set_header Host $host;
    # }

    # 🔧 NOWA SEKCJA: Specjalna obsługa przekierowań CodeIgnitera
    # Ta sekcja uruchamia się tylko wtedy, gdy try_files w /api nie znajdzie pliku fizycznego.
    location @codeigniter {
        # Przepisujemy URL: /api/heroes -> /api/index.php?/heroes
        # 'last' sprawia, że Nginx mieli ten nowy adres od nowa i trafia
        # poprawnie do 'location /api' -> 'location ~ \.php$'
        rewrite ^/api/(.*)$ /api/index.php?/$1 last;
    }
}