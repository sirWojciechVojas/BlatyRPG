services:
  # 1. NGINX gateway
  nginx:
    image: nginx:alpine
    container_name: blatyrpg_nginx
    restart: unless-stopped
    ports:
      - "8443:443"
      - "8082:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs:ro
      - ./backend:/var/www/html
    depends_on:
      php:
        condition: service_healthy
      frontend:
        condition: service_healthy
      websocket:
        condition: service_started

  # 2. PHP backend
  php:
    build:
      context: ./docker/php
    container_name: blatyrpg_php
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      CI_ENVIRONMENT: development
      SHOP_ALLOW_ANONYMOUS_SHOP_ACCESS: "true"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 3. MySQL database
  mysql:
    image: mysql:8.0
    container_name: blatyrpg_mysql
    restart: always
    environment:
      MYSQL_DATABASE: blatyrpg
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 180s

  # 4. Frontend Vue.js
  frontend:
    image: node:22-alpine
    container_name: blatyrpg_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "if [ ! -x node_modules/.bin/vue-cli-service ]; then npm ci; fi && npm run serve -- --host 0.0.0.0 --port 8080"
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=1024
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_INTERVAL=2000
      - WATCHPACK_POLLING_INTERVAL=2000
      - VUE_CLI_USE_POLLING=true
      - WDS_SOCKET_URL=auto://0.0.0.0:0/ws
      - WDS_SOCKET_PATH=/ws
    depends_on:
      php:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  # 5. WebSocket server (standby mode)
  websocket:
    image: node:22-alpine
    container_name: blatyrpg_websocket
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./websocket:/app
    # Keeps the container alive until websocket code is added.
    command: tail -f /dev/null

volumes:
  mysql_data:
  frontend_node_modules:

networks:
  default:
    name: blatyrpg_network
