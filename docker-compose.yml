services:
  # 1. NGINX gateway
  nginx:
    image: nginx:alpine
    container_name: blatyrpg_nginx
    restart: unless-stopped
    ports:
      - "8443:443"
      - "8082:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs:ro
      - ./backend:/var/www/html
    depends_on:
      php:
        condition: service_healthy
      frontend:
        condition: service_healthy
      websocket:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && wget --no-check-certificate -q --spider https://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 2. PHP backend
  php:
    build:
      context: ./docker/php
      args:
        APP_ENV_GID: ${HOST_APP_GROUP_ID:-82}
    container_name: blatyrpg_php
    restart: unless-stopped
    group_add:
      - "${HOST_APP_GROUP_ID:-82}"
    volumes:
      - ./backend:/var/www/html
      - ./docs:/var/www/compendium:ro
      - handout_storage:/var/www/html/writable/uploads/handouts
      - audio_storage:/var/www/html/writable/uploads/audio
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-development}
      SHOP_ALLOW_ANONYMOUS_SHOP_ACCESS: ${SHOP_ALLOW_ANONYMOUS_SHOP_ACCESS:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_TIME_TO_LIVE: ${JWT_TIME_TO_LIVE:-3600}
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-https://localhost:8443/api/auth/oauth}
      OAUTH_FRONTEND_CALLBACK_URL: ${OAUTH_FRONTEND_CALLBACK_URL:-https://localhost:8443/#/oauth/callback}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_OAUTH_CLIENT_ID: ${FACEBOOK_OAUTH_CLIENT_ID:-}
      FACEBOOK_OAUTH_CLIENT_SECRET: ${FACEBOOK_OAUTH_CLIENT_SECRET:-}
      DISCORD_OAUTH_CLIENT_ID: ${DISCORD_OAUTH_CLIENT_ID:-}
      DISCORD_OAUTH_CLIENT_SECRET: ${DISCORD_OAUTH_CLIENT_SECRET:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-https://localhost:8443/#/password-reset/confirm}
      PASSWORD_RESET_TIME_TO_LIVE: ${PASSWORD_RESET_TIME_TO_LIVE:-1800}
      email.fromEmail: ${MAIL_FROM_ADDRESS:-no-reply@blatyrpg.local}
      email.fromName: ${MAIL_FROM_NAME:-Blaty RPG}
      email.protocol: ${MAIL_PROTOCOL:-mail}
      email.SMTPHost: ${MAIL_SMTP_HOST:-}
      email.SMTPUser: ${MAIL_SMTP_USER:-}
      email.SMTPPass: ${MAIL_SMTP_PASSWORD:-}
      email.SMTPPort: ${MAIL_SMTP_PORT:-587}
      email.SMTPCrypto: ${MAIL_SMTP_CRYPTO:-tls}
      REALTIME_TICKET_SECRET: ${REALTIME_TICKET_SECRET:?REALTIME_TICKET_SECRET is required}
      REALTIME_TICKET_ISSUER: ${REALTIME_TICKET_ISSUER:-BlatyRPG}
      REALTIME_TICKET_AUDIENCE: ${REALTIME_TICKET_AUDIENCE:-blatyrpg-realtime}
      REALTIME_CALENDAR_PUBLISH_URL: ${REALTIME_CALENDAR_PUBLISH_URL:-http://websocket:8081/internal/calendar}
      REALTIME_CHARACTER_ACCESS_PUBLISH_URL: ${REALTIME_CHARACTER_ACCESS_PUBLISH_URL:-http://websocket:8081/internal/character-access}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_TOKEN_TTL: ${LIVEKIT_TOKEN_TTL:-300}
      AUDIO_UPLOAD_MAX_BYTES: ${AUDIO_UPLOAD_MAX_BYTES:-52428800}
      MEDIA_UPLOAD_MAX_BYTES: ${MEDIA_UPLOAD_MAX_BYTES:-5368709120}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-dajzxmjyc}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:-blatyrpg-media-public}
      R2_PRIVATE_BUCKET: ${R2_PRIVATE_BUCKET:-blatyrpg-media-private}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      MAP_AI_PROVIDER: ${MAP_AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      MAP_AI_TEXT_MODEL: ${MAP_AI_TEXT_MODEL:-gpt-5.4-mini}
      MAP_AI_IMAGE_MODEL: ${MAP_AI_IMAGE_MODEL:-gpt-image-2}
      MAP_AI_TIMEOUT_SECONDS: ${MAP_AI_TIMEOUT_SECONDS:-120}
      MAP_AI_DAILY_COST_UNITS: ${MAP_AI_DAILY_COST_UNITS:-50}
      database.default.hostname: mysql
      database.default.database: ${MYSQL_DATABASE:-blatyrpg}
      database.default.username: ${MYSQL_APP_USER:?MYSQL_APP_USER is required}
      database.default.password: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      database.default.DBDriver: MySQLi
      database.default.port: "3306"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Durable queue consumer for editable map layouts and generated assets.
  map-ai-worker:
    build:
      context: ./docker/php
      args:
        APP_ENV_GID: ${HOST_APP_GROUP_ID:-82}
    restart: unless-stopped
    group_add:
      - "${HOST_APP_GROUP_ID:-82}"
    working_dir: /var/www/html
    command: php spark maps:ai-worker
    volumes:
      - ./backend:/var/www/html
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-development}
      MAP_AI_PROVIDER: ${MAP_AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      MAP_AI_TEXT_MODEL: ${MAP_AI_TEXT_MODEL:-gpt-5.4-mini}
      MAP_AI_IMAGE_MODEL: ${MAP_AI_IMAGE_MODEL:-gpt-image-2}
      MAP_AI_TIMEOUT_SECONDS: ${MAP_AI_TIMEOUT_SECONDS:-120}
      MAP_AI_DAILY_COST_UNITS: ${MAP_AI_DAILY_COST_UNITS:-50}
      database.default.hostname: mysql
      database.default.database: ${MYSQL_DATABASE:-blatyrpg}
      database.default.username: ${MYSQL_APP_USER:?MYSQL_APP_USER is required}
      database.default.password: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      database.default.DBDriver: MySQLi
      database.default.port: "3306"
    depends_on:
      mysql:
        condition: service_healthy

  # Private asset retention is deliberately handled outside web requests.
  handout-purge:
    build:
      context: ./docker/php
      args:
        APP_ENV_GID: ${HOST_APP_GROUP_ID:-82}
    restart: unless-stopped
    group_add:
      - "${HOST_APP_GROUP_ID:-82}"
    working_dir: /var/www/html
    command: sh -c "while true; do php spark handouts:purge-deleted || true; sleep 86400; done"
    volumes:
      - ./backend:/var/www/html
      - handout_storage:/var/www/html/writable/uploads/handouts
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-development}
      database.default.hostname: mysql
      database.default.database: ${MYSQL_DATABASE:-blatyrpg}
      database.default.username: ${MYSQL_APP_USER:?MYSQL_APP_USER is required}
      database.default.password: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      database.default.DBDriver: MySQLi
      database.default.port: "3306"
    depends_on:
      mysql:
        condition: service_healthy

  # 3. MySQL database
  mysql:
    image: mysql:8.4
    container_name: blatyrpg_mysql
    ports:
      - "3307:3306"
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blatyrpg}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: ${MYSQL_APP_USER:?MYSQL_APP_USER is required}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/90-limit-app-user.sh:/docker-entrypoint-initdb.d/90-limit-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 180s

  # 4. Frontend Vue.js
  frontend:
    image: node:22-alpine
    container_name: blatyrpg_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >-
      sh -c 'handout_lock_hash=$$(sha256sum package-lock.json | cut -d " " -f 1);
      handout_installed_hash=$$(cat node_modules/.package-lock.sha256 2>/dev/null || true);
      if [ ! -x node_modules/.bin/vue-cli-service ] || [ "$$handout_lock_hash" != "$$handout_installed_hash" ]; then
      npm ci && printf "%s\n" "$$handout_lock_hash" > node_modules/.package-lock.sha256;
      fi;
      exec npm run serve -- --host 0.0.0.0 --port 8080'
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=1024
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_INTERVAL=2000
      - WATCHPACK_POLLING_INTERVAL=2000
      - VUE_CLI_USE_POLLING=true
      - WDS_SOCKET_URL=auto://0.0.0.0:0/ws
      - WDS_SOCKET_PATH=/ws
      - VUE_APP_REALTIME_PATH=/realtime
    depends_on:
      php:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  # 5. Authoritative realtime WebSocket server
  websocket:
    image: node:22-alpine
    container_name: blatyrpg_websocket
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./websocket:/app
      - websocket_node_modules:/app/node_modules
    command: sh -c "npm ci --omit=dev && npm start"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WS_HOST: 0.0.0.0
      WS_PORT: "8081"
      WS_PATH: /realtime
      WS_HEALTH_PATH: /health
      WS_TICKET_SECRET: ${REALTIME_TICKET_SECRET:?REALTIME_TICKET_SECRET is required}
      WS_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:?REALTIME_ALLOWED_ORIGINS is required}
      WS_TICKET_ISSUER: ${REALTIME_TICKET_ISSUER:-BlatyRPG}
      WS_TICKET_AUDIENCE: ${REALTIME_TICKET_AUDIENCE:-blatyrpg-realtime}
      WS_BACKEND_INTERNAL_URL: ${REALTIME_INTERNAL_URL:-http://nginx:8083/api/internal/realtime}
      WS_BACKEND_TIMEOUT_MS: ${REALTIME_INTERNAL_TIMEOUT_MS:-5000}
      WS_CHAT_PAGE_LIMIT: ${REALTIME_CHAT_PAGE_LIMIT:-20}
      WS_CALENDAR_PUBLISH_PATH: /internal/calendar
      WS_CHARACTER_ACCESS_PUBLISH_PATH: /internal/character-access
    depends_on:
      php:
        condition: service_healthy
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Optional local SFU. For LiveKit Cloud leave this profile disabled and set
  # LIVEKIT_URL/API credentials to the Cloud project values.
  livekit:
    image: livekit/livekit-server:v1.13.6
    profiles: ["self-hosted-livekit"]
    restart: unless-stopped
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD", "/livekit-server", "ports"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  mysql_data:
  frontend_node_modules:
  websocket_node_modules:
  handout_storage:
  audio_storage:

networks:
  default:
    name: blatyrpg_network
