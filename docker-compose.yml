services:
  # 1. NGINX gateway
  nginx:
    image: nginx:alpine
    container_name: blatyrpg_nginx
    restart: unless-stopped
    ports:
      - "8443:443"
      - "8082:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs:ro
      - ./backend:/var/www/html
    depends_on:
      php:
        condition: service_healthy
      frontend:
        condition: service_healthy
      websocket:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && wget --no-check-certificate -q --spider https://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 2. PHP backend
  php:
    build:
      context: ./docker/php
    container_name: blatyrpg_php
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-development}
      SHOP_ALLOW_ANONYMOUS_SHOP_ACCESS: ${SHOP_ALLOW_ANONYMOUS_SHOP_ACCESS:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_TIME_TO_LIVE: ${JWT_TIME_TO_LIVE:-3600}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-https://localhost:8443/#/password-reset/confirm}
      PASSWORD_RESET_TIME_TO_LIVE: ${PASSWORD_RESET_TIME_TO_LIVE:-1800}
      email.fromEmail: ${MAIL_FROM_ADDRESS:-no-reply@blatyrpg.local}
      email.fromName: ${MAIL_FROM_NAME:-Blaty RPG}
      email.protocol: ${MAIL_PROTOCOL:-mail}
      email.SMTPHost: ${MAIL_SMTP_HOST:-}
      email.SMTPUser: ${MAIL_SMTP_USER:-}
      email.SMTPPass: ${MAIL_SMTP_PASSWORD:-}
      email.SMTPPort: ${MAIL_SMTP_PORT:-587}
      email.SMTPCrypto: ${MAIL_SMTP_CRYPTO:-tls}
      REALTIME_TICKET_SECRET: ${REALTIME_TICKET_SECRET:?REALTIME_TICKET_SECRET is required}
      REALTIME_TICKET_ISSUER: ${REALTIME_TICKET_ISSUER:-BlatyRPG}
      REALTIME_TICKET_AUDIENCE: ${REALTIME_TICKET_AUDIENCE:-blatyrpg-realtime}
      database.default.hostname: mysql
      database.default.database: ${MYSQL_DATABASE:-blatyrpg}
      database.default.username: ${MYSQL_APP_USER:?MYSQL_APP_USER is required}
      database.default.password: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      database.default.DBDriver: MySQLi
      database.default.port: "3306"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 3. MySQL database
  mysql:
    image: mysql:8.0
    container_name: blatyrpg_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blatyrpg}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: ${MYSQL_APP_USER:?MYSQL_APP_USER is required}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/90-limit-app-user.sh:/docker-entrypoint-initdb.d/90-limit-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 180s

  # 4. Frontend Vue.js
  frontend:
    image: node:22-alpine
    container_name: blatyrpg_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "if [ ! -x node_modules/.bin/vue-cli-service ]; then npm ci; fi && npm run serve -- --host 0.0.0.0 --port 8080"
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=1024
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_INTERVAL=2000
      - WATCHPACK_POLLING_INTERVAL=2000
      - VUE_CLI_USE_POLLING=true
      - WDS_SOCKET_URL=auto://0.0.0.0:0/ws
      - WDS_SOCKET_PATH=/ws
      - VUE_APP_REALTIME_PATH=/realtime
    depends_on:
      php:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  # 5. Authoritative realtime WebSocket server
  websocket:
    image: node:22-alpine
    container_name: blatyrpg_websocket
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./websocket:/app
      - websocket_node_modules:/app/node_modules
    command: sh -c "npm ci --omit=dev && npm start"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WS_HOST: 0.0.0.0
      WS_PORT: "8081"
      WS_PATH: /realtime
      WS_HEALTH_PATH: /health
      WS_TICKET_SECRET: ${REALTIME_TICKET_SECRET:?REALTIME_TICKET_SECRET is required}
      WS_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:?REALTIME_ALLOWED_ORIGINS is required}
      WS_TICKET_ISSUER: ${REALTIME_TICKET_ISSUER:-BlatyRPG}
      WS_TICKET_AUDIENCE: ${REALTIME_TICKET_AUDIENCE:-blatyrpg-realtime}
    depends_on:
      php:
        condition: service_healthy
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  mysql_data:
  frontend_node_modules:
  websocket_node_modules:

networks:
  default:
    name: blatyrpg_network
